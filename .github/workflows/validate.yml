name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: plugin

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check distributable
        run: node --check dist/health-bridge-dashboard-card.js
      - name: Run smoke test
        run: node tests/smoke.mjs
